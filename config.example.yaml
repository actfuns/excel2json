# excel2json 配置文件示例
#
# 使用方式：
#   excel2json --config config.yaml
#   excel2json --config config.yaml 配置表/*.xlsx
#
# 优先级：内置默认值 < config.yaml < 命令行显式参数
# 路径（inputs/out/types）相对 config.yaml 所在目录解析。

# 配置格式版本，目前只支持 1
version: 1

# 输入文件、目录或 glob；命令行传了 inputs 时以命令行为准
inputs: []
# inputs:
#   - "./配置表"
#   - "./配置表/*.xlsx"

# 输出目录或文件
out: ""

# json 或 csv
format: json

# utf8, utf8-nobom, utf8-bom, gbk, gb18030
encoding: utf8-nobom

# 行号从 0 开始
header_row: 0
type_row: -1
data_row: -1

# 日期格式
date_format: "yyyy/MM/dd"

# 解析无类型单元格中的 JSON / 全部转字符串
parse_cell_json: false
stringify_all: false

# 字段处理
lowercase: false
exclude: []
# exclude:
#   - "#"
tag: ""
strict_tags: false
verbose: false
required_by_default: false

# 输出格式
list: false
merge_sheets: false
name_tpl: "{file}_{sheet}"
pretty: false
key: ""
unique_keys: false

# 命名类型定义，支持三种写法：
#
# 1. 引用 types.yaml
# types: ./types.yaml
#
# 2. 内联映射
# types:
#   itemId: "string:ref(item.id)"
#   items: "$[*][1::3]:string:ref(item.id)"
#
# 3. 内联列表
# types:
#   - name: itemId
#     format: "string:ref(item.id)"
