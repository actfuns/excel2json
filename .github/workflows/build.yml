name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Tidy
        run: go mod tidy

      - name: Format
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      - name: Test
        run: go test ./...

      - name: Race
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Build
        shell: bash
        run: go build -o excel2json${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/excel2json

      - name: Smoke test
        shell: bash
        run: |
          bin="excel2json${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          test -f "$bin" || { echo "Binary not found: $bin"; exit 1; }
          "./$bin" --help