name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Tidy
        run: go mod tidy

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        shell: bash
        run: go build -o excel2json${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/excel2json

      - name: Smoke test
        shell: bash
        run: |
          bin="excel2json${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          test -f "$bin" || { echo "Binary not found: $bin"; exit 1; }
          "./$bin" --help